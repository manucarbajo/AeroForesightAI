[project]
name = "aeroforesight"
version = "0.1.0"
description = "Hybride Multi-Agenten-Simulationsplattform für strategische Zukunftsplanung im Luftverkehr: deterministische Massensimulation kombiniert mit generativer KI, abgesichert durch CIB-Konsistenzfilter."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "langgraph>=0.2",
    "langgraph-cli[inmem]>=0.2",
    "requests>=2.0",
    "langchain-ollama>=0.3.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "plotly",
    "dash>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
]
# Der Ueberlauf-Waechter aus P1.7-D (`tests/test_web_overflow.py`). Bewusst ein
# eigenes Extra und nicht Teil von `dev`: Er braucht einen echten Browser
# (`playwright install chromium`, rund 150 MB), und ohne den ueberspringt sich
# der Test von selbst. Pixel kann eine Testsuite ohne Browser nicht messen --
# wer sie messen will, holt sich diese Zeile.
ui = [
    "playwright",
]
# Nur zum **Auffrischen** der Backtest-Reihen (`scripts/backtest_daten_holen.py`).
# Die Daten liegen fertig unter `configs/backtest/` und sind eingecheckt -- wer
# das Repo klont, rechnet den Backtest ohne diese Zeile. Gebraucht werden sie,
# weil das EEX-Archiv seine Jahrgaenge bis 2019 als altes .xls ausliefert und ab
# 2020 als .xlsx: zwei Formate, zwei Leser.
backtest = [
    "openpyxl",
    "xlrd<3",
]

# **Welche Pakete die Installation liefert** (P4.6). Ohne diese Angabe hielt
# setuptools das Verzeichnis `src` für das übliche src-Layout und legte es
# SELBST in den Suchpfad: `import src` scheiterte außerhalb des Repos, und
# `models`, `llm`, `agents` … lösten als lose Top-Level-Module auf — mit zwei
# verschiedenen `SimulationState`-Klassen, je nach Importweg. Das Paket heißt
# hier aber `src`, also wird es als Paket installiert.
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
extend-exclude = "docs/"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["outputs", "docs", "*/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: Zeilenlänge wird von black gehandhabt.
# E402: mehrere Einstiegspunkte (run_simulation.py, langgraph_studio/*, scenario_sweeps.py)
# fügen das Repo-Root per sys.path.append VOR den lokalen Imports hinzu — das ist beabsichtigt
# und kein Formatierungsfehler.
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# Import order here is load-bearing (breaks a state_models/event_models circular
# import if alphabetized) — see comment in the file itself.
"src/models/__init__.py" = ["I001"]

# **Der Typprüfer für die Grenzen** (P4.4). Nicht das ganze Repo und nicht
# `--strict`: Ein Prüfer, der hundert Meldungen wirft, wird abgeschaltet statt
# gelesen. Angefangen wird bei den Grenzen — den Modellen und den Modulen, die
# `RunArgs` und `SimulationState` erzeugen oder lesen. **Die Liste wächst**, und
# jede Datei kommt erst hinein, wenn sie sauber ist.
#
# `python_version = 3.12`, weil numpys eigene Typdateien Syntax ab 3.12 benutzen
# (`type`-Anweisung) — mit 3.11 bricht mypy dort ab, bevor er etwas prüft. 3.12
# ist zugleich die Version der CI. `follow_imports = silent`: Importierte Module
# außerhalb der Liste werden gelesen, ihre Fehler aber nicht gemeldet.
[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
files = [
    "src/models",
    "src/config_loader.py",
    "src/run_simulation.py",
    "src/orchestration/langgraph_adapter.py",
    "src/orchestration/scenario_sweeps.py",
    "src/orchestration/simulation_runner.py",
    "src/reporting/output_writer/metadata.py",
    "src/reporting/output_writer/provenance.py",
    "dashboard/run_launcher.py",
]

# `langgraph_api` liefert keine Typangaben. Importiert wird es nur, um zu prüfen,
# ob LangGraph Studio installiert ist (`run_simulation._launch_studio`).
[[tool.mypy.overrides]]
module = ["langgraph_api"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Die Teile des Browser-Wächters (`tests/test_web_overflow.py`), einzeln wählbar:
# `pytest tests/test_web_overflow.py -m hoehe` läuft nur, was die Schritthöhe
# misst, und zahlt nur den einen Gang durch die Schrittfolge. `leistung` ist die
# Ausnahme: Die Klickdauer läuft nur, wenn sie ausdrücklich gewählt ist.
markers = [
    "ueberlauf: Browser-Wächter — nichts tritt aus seinem Kasten, die Seite schiebt nicht",
    "hoehe: Browser-Wächter — wie viele Bildschirme ein Schritt hoch ist (DECKEL)",
    "breite: Browser-Wächter — Spaltenfüllung und Prosabreite",
    "kanten: Browser-Wächter — jede Textspalte auf dem Einzugsraster",
    "schmal: Browser-Wächter — Fußleiste und Schrittliste bei 375 px",
    "klassen: Browser-Wächter — jede benutzte Klasse hat eine Regel",
    "netz: Browser-Wächter — kein Aufruf verlässt den eigenen Server",
    "symbole: Browser-Wächter — jedes gezeichnete Symbol steckt im Teilsatz",
    "legende: Browser-Wächter — Titel, Achsen und Legende überlappen nicht",
    "rundlaeufe: Browser-Wächter — Server-Aufrufe je Klick in der Schrittfolge",
    "modellbereich: Browser-Wächter — der Modell-Bereich wird aus- und eingehängt",
    "rueckfrage: Browser-Wächter — die Rückfrage öffnet, fokussiert und schließt sich",
    "laufwahl: Browser-Wächter — der Lauf-Browser öffnet modal, sucht und wählt",
    "zeitleiste: Browser-Wächter — zwei schnelle Klicks auf «Ein Tick vor» sind zwei Ticks",
    "leistung: Leistungsmessung (Klickdauer, P7.11) — läuft nur mit -m leistung",
]
