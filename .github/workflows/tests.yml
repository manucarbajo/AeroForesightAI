name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests (pytest)
        # Deselects three tests documented in CLAUDE.md and scheduled as P4.2 in
        # docs/projektplan.md:
        #   - the two sweep tests need a local Ollama server (never available on the
        #     CI runner) and *hang* rather than fail without one; they need a skipif
        #     with a hard timeout, not a deselect.
        #   - test_market_rules_resolve_marginal_cost_fraction is NOT a code bug
        #     (re-assessed 2026-08-25): the test expects the 0.33 default from
        #     market_rules.py:45 while configs/properties.json supplies 0.25, and the
        #     resolution correctly lets the config win. Open question is which
        #     marginal-cost fraction is right, then test or config follows.
        # All three deselects go away with P4.2. Do not add a fourth: a deselect here
        # hides the problem from CI, which is exactly how these three survived so long.
        #
        # tests/test_web_overflow.py (the P1.7-D overflow guard) is NOT deselected --
        # it skips itself, because playwright lives in the optional `ui` extra and no
        # browser is installed here. That was a deliberate call: the guard needs a real
        # browser (~150 MB per run) and is meant to be run locally by whoever touches
        # the presentation layer. To arm it in CI, add `pip install playwright &&
        # playwright install chromium` above -- and expect roughly four more minutes.
        run: |
          pytest -q \
            --deselect tests/test_scenario_sweeps.py::test_run_single_sweep_short \
            --deselect tests/test_scenario_sweeps.py::test_sweep_base_price_override_raises_ticket_price \
            --deselect tests/test_market_feedback.py::TestM413ConfigurablePrice::test_market_rules_resolve_marginal_cost_fraction
