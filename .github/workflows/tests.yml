name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black pytest mypy
          # P4.6: the project itself, so tests/test_packaging.py can measure that
          # `src` is importable as a package from outside the repo. --no-deps,
          # because requirements.txt already brought the dependencies. Until P4.6
          # CI never installed the project, and `src` was importable only because
          # pytest puts the repository root on sys.path.
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        # P4.4: the boundaries first. The file list lives in pyproject.toml
        # ([tool.mypy] files) and grows -- a file goes in once it is clean. Until
        # P4.4 the project had no type checker at all, and a signature that
        # contradicted its return (P3.15) stayed green for twelve days.
        run: mypy

      - name: Tests (pytest)
        # There is no deselect list any more, and there must not be a new one.
        #
        # P4.2 removed the last two (2026-09-08). They were the two sweep tests,
        # carried since 2026-08-25 as "need a local Ollama server and *hang*
        # rather than fail without one". Measured, that diagnosis was too coarse:
        # an endpoint where nobody listens fails fast (ConnectionError is a
        # RequestException, and OllamaClient gives up on those immediately) --
        # what hangs is an endpoint that accepts the connection and does not
        # answer, because ReadTimeout is retried three times with doubling, up to
        # 870 s per call. A CI runner is the first case, a developer machine with
        # Ollama installed but no model loaded is the second.
        #
        # The fix is not a skipif. Neither test is about the language model: a
        # sweep computes its ticks deterministically, and the only LLM call is the
        # closing narrative. run_single_sweep now takes llm_narrative=False, so
        # the tests say they do not need it instead of switching themselves off
        # when it is missing -- a skipif would have dropped the only end-to-end
        # assertion about the sweep path on every machine without Ollama, which is
        # nearly all of them.
        #
        # The third deselect (test_market_rules_resolve_marginal_cost_fraction) is gone
        # since 2026-09-03: it was never a code bug but a stale expectation, and behind
        # it sat the real finding -- two sources for the same value. P2.11 removed the
        # literal fallbacks in resolve_market_feedback_config; the shipped 0.25 wins,
        # and the test says so.
        #
        # Do not add a deselect here. It hides the problem from CI, which is
        # exactly how these two survived for two weeks. If a test cannot run in
        # CI, it skips itself with a reason (see the browser guard below).
        #
        # tests/test_web_overflow.py (the P1.7-D overflow guard) is NOT deselected --
        # it skips itself, because playwright lives in the optional `ui` extra and no
        # browser is installed here. That was a deliberate call: the guard needs a real
        # browser (~150 MB per run) and takes ~25 minutes, so it does not belong in the
        # path of every commit.
        #
        # It now runs in its own workflow: .github/workflows/browser.yml -- on demand,
        # nightly, and on every pull request that touches dashboard/web/** (P3.17).
        # Do NOT arm it here as well. The reason it needed its own workflow is worth
        # knowing: "whoever touches the presentation layer runs it locally" was refuted
        # three times in six days, and each time the regression sat unseen for days
        # (P2.0-C, then A1 and P2.8-Rest -- all three touched dashboard/web/**, which is
        # exactly what the new paths filter watches).
        run: pytest -q
